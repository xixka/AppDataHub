<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppDataHub</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect x="2" y="2" width="24" height="24" rx="6" fill="#3b82f6"/>
                        <path d="M9 14l3.5 3.5L19 11" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>AppDataHub</span>
                </div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-ghost" id="btn-settings" title="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button class="btn btn-primary btn-sm" id="btn-add-account">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加账号
                </button>
            </div>
        </header>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">配置目录:</span>
                <span class="status-value" id="profile-config-path">检测中...</span>
            </div>
            <div class="status-item">
                <span class="status-label">应用状态:</span>
                <span class="status-value" id="app-running-status">检测中...</span>
            </div>
            <button class="btn btn-ghost btn-xs" id="btn-refresh-status" title="刷新">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/>
                    <polyline points="1 20 1 14 7 14"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </button>
        </div>

        <main class="main-content">
            <div class="account-list" id="account-list"></div>
            <div class="empty-state" id="empty-state" style="display:none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7.5" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
                <p>还没有账号</p>
                <p class="hint">点击右上角"添加账号"开始</p>
            </div>
        </main>

        <!-- 添加/编辑账号弹窗 -->
        <div class="modal-overlay" id="modal-account" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modal-title">添加账号</h3>
                    <button class="btn btn-ghost btn-xs" id="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>账号名称 <span class="required">*</span></label>
                        <input type="text" id="input-name" placeholder="例如：工作账号" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>邮箱 (选填)</label>
                        <input type="email" id="input-email" placeholder="user@example.com" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>备注 (选填)</label>
                        <textarea id="input-note" rows="2" placeholder="可选备注"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" id="modal-cancel">取消</button>
                    <button class="btn btn-primary" id="modal-save">保存</button>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="modal-overlay" id="modal-settings" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h3>设置</h3>
                    <button class="btn btn-ghost btn-xs" id="settings-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>应用配置目录</label>
                        <input type="text" id="input-config-dir" readonly>
                    </div>
                    <div class="form-group">
                        <label>用户数据目录</label>
                        <input type="text" id="input-data-dir" readonly>
                    </div>
                    <div class="form-group">
                        <label>应用 Profile</label>
                        <select id="select-profile" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg-secondary);">
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-ghost btn-sm" id="btn-detect-paths">重新检测已安装应用</button>
                    </div>
                    <div class="info-box">
                        <p><strong>说明:</strong></p>
                        <p>首次启动会自动检测已安装的应用 (Trae / VS Code / Cursor) 并生成 profiles.json。</p>
                        <p>切换账号时，工具会备份当前配置目录并恢复目标账号的配置。</p>
                        <p>请确保切换时目标应用已关闭，否则配置可能无法正确生效。</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-ghost" id="settings-cancel">关闭</button>
                </div>
            </div>
        </div>

        <div class="toast-container" id="toast-container"></div>
    </div>
    <script src="scripts/main.js"></script>
</body>
</html>
