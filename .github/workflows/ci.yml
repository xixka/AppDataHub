name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cargo clippy --no-default-features --features core-only --lib -- -D warnings
      - run: cargo test --no-default-features --features core-only --lib

  build-windows:
    name: Build Windows Dev
    needs: test-core
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-debug-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-debug-

      - name: Build Windows executable (dev)
        env:
          CXXFLAGS: /std:c++17 /EHsc
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle --ci --debug

      - name: Rename exe
        shell: pwsh
        run: |
          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\debug\appdatahub.exe" "AppDataHub.exe" -Force
          Write-Host "Exe size: $((Get-Item AppDataHub.exe).Length / 1MB) MB"

      - name: Upload exe to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          body: |
            自动构建 (dev)

            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
            时间: ${{ github.run_started_at }} UTC
          files: AppDataHub.exe
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
