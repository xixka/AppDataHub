name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: cargo clippy --no-default-features --features core-only --lib -- -D warnings
      - run: cargo test --no-default-features --features core-only --lib

  build-windows:
    name: Build Windows Portable
    needs: test-core
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build Windows executable
        env:
          CXXFLAGS: /std:c++17 /EHsc
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle --ci

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $portableDir = "portable\AppDataHub-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\appdatahub.exe" (Join-Path $portableDir "AppDataHub.exe") -Force
          Copy-Item "LICENSE" (Join-Path $portableDir "LICENSE") -Force
          Set-Content -Path (Join-Path $portableDir "portable.marker") -Value "" -NoNewline
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath "AppDataHub-portable.zip" -Force
          Write-Host "Package size: $((Get-Item AppDataHub-portable.zip).Length / 1KB) KB"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AppDataHub-portable
          path: AppDataHub-portable.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: AppDataHub v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            artifacts/AppDataHub-portable/*.zip
          draft: true
